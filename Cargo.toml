[package]
name = "steve-assist"
version = "0.1.0"
default-run = "steve-assist"
edition = "2024"

[lib]
name = "steve_assist"
path = "src/lib.rs"

[[bin]]
name = "steve-assist"
path = "src/main.rs"

[[bin]]
name = "steve-e2e"
path = "src/bin/steve_e2e/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
gcp_auth = "0.12"
googleapis-tonic-google-cloud-speech-v1 = "0.10"
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots", "tls-native-roots"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
firestore = "0.44"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
url = "2"
tower-http = { version = "0.6", features = ["cors"] }
