{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.tls.acmeEmail }}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: {{ .Values.tls.dnsProject }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: steve-assist-tls
  namespace: istio-system
spec:
  secretName: steve-assist-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.tls.host | quote }}
{{- end }}
