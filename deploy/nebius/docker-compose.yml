# Deploys the Steve backend and dashboard frontend behind Caddy (auto-TLS) on a single Nebius VM.
# Compose-level vars (STEVE_DOMAIN, DASHBOARD_DOMAIN, ACME_EMAIL, VITE_GOOGLE_CLIENT_ID)
# come from deploy/nebius/.env next to this file or the shell environment.
# Run from the repo root on the VM:
#   docker compose -f deploy/nebius/docker-compose.yml up -d --build
services:
  steve:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/steve/.env
    environment:
      # Firestore service-account key, mounted read-only below.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - /opt/steve/gcp-sa.json:/run/secrets/gcp-sa.json:ro
    expose:
      - "8080"

  frontend:
    build:
      context: ../../frontend
      args:
        # Baked into the static bundle at build time.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?set VITE_GOOGLE_CLIENT_ID}
        VITE_API_BASE_URL: https://${STEVE_DOMAIN:?set STEVE_DOMAIN}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - steve
      - frontend
    environment:
      STEVE_DOMAIN: ${STEVE_DOMAIN:?set STEVE_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?set DASHBOARD_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
