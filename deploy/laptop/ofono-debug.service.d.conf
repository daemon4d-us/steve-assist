# Optional systemd drop-in for debugging oFono's HFP plugin.
# Install to /etc/systemd/system/ofono.service.d/debug.conf then
#   sudo systemctl daemon-reload && sudo systemctl restart ofono
# The stock unit sends stderr to /dev/null and runs without -d, so nothing
# useful reaches the journal otherwise. Remove the drop-in when done.
[Service]
ExecStart=
ExecStart=/usr/sbin/ofonod -n -d
StandardError=journal
