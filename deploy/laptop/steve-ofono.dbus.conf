<!-- D-Bus policy for the Steve Bluetooth bridge.
     Install to /etc/dbus-1/system.d/steve-ofono.conf

     oFono's own policy (ofono.conf) allows only root and at_console users to
     talk to org.ofono. The bridge and PipeWire's oFono backend run as the
     desktop user, so grant that user explicitly. User policies are applied
     after the default deny, so this overrides it. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="dsidorenko">
    <allow send_destination="org.ofono"/>
    <allow receive_sender="org.ofono"/>
  </policy>
</busconfig>
